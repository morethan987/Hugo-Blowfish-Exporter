name: Bun build

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # 1. 替换 setup-node 为 setup-bun
            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            # 2. 使用 bun install 替代 npm ci
            # --frozen-lockfile 相当于 npm ci，确保完全按照 bun.lockb 安装
            - name: Install dependencies
              run: bun install --frozen-lockfile

            # 3. 使用 bun 运行构建命令
            - name: Build
              run: bun run build --if-present

            # 4. 使用 bun 运行 lint
            - name: Lint
              run: bun run lint
